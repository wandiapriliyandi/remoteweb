name: Build and Release RemoteWebMonitor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executables (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Uninstall.exe
        run: pyinstaller Uninstall.spec

      - name: Build ClientAgent.exe
        run: pyinstaller ClientAgent.spec

      - name: Build ServerAdmin.exe
        run: pyinstaller ServerAdmin.spec

      - name: Build Setup_RemoteMonitor.exe
        run: pyinstaller Setup_RemoteMonitor.spec

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ServerAdmin.exe
            dist/ClientAgent.exe
            dist/Setup_RemoteMonitor.exe
            dist/Uninstall.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
