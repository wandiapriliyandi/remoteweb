name: Build and Release RemoteWebMonitor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executables (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Automated Tests
        run: python run_tests.py

      - name: Compile Native Updater.exe
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:assets\Updater.exe "updater_source\Updater.cs"

      - name: Build Uninstall.exe
        run: pyinstaller Uninstall.spec

      - name: Build ClientAgent.exe
        run: pyinstaller ClientAgent.spec

      - name: Build ServerAdmin.exe
        run: pyinstaller ServerAdmin.spec

      - name: Build Setup_RemoteMonitor.exe
        run: pyinstaller Setup_RemoteMonitor.spec

      - name: Create Versioned Copies
        shell: pwsh
        run: |
          Copy-Item "dist/Setup_RemoteMonitor.exe" "dist/Setup_RemoteMonitor_${{ github.ref_name }}.exe"
          Copy-Item "dist/ServerAdmin.exe" "dist/ServerAdmin_${{ github.ref_name }}.exe"
          Copy-Item "dist/ClientAgent.exe" "dist/ClientAgent_${{ github.ref_name }}.exe"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Setup_RemoteMonitor_${{ github.ref_name }}.exe
            dist/ServerAdmin_${{ github.ref_name }}.exe
            dist/ClientAgent_${{ github.ref_name }}.exe
            dist/Setup_RemoteMonitor.exe
            dist/ServerAdmin.exe
            dist/ClientAgent.exe
            dist/Uninstall.exe
            assets/Updater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
